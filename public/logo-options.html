<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BuildKind Logo Options</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: #faf7f1;
        color: #111827;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        max-width: 1120px;
        margin: 0 auto;
        padding: 44px 24px 56px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 30px;
        line-height: 1.15;
      }
      p {
        margin: 0 0 28px;
        color: #6b7280;
        line-height: 1.6;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
      }
      .card {
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        background: #fff;
        padding: 22px;
        box-shadow: 0 8px 28px rgba(17, 24, 39, 0.06);
      }
      .label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 16px;
        color: #374151;
        font-size: 13px;
        font-weight: 750;
      }
      .tag {
        border-radius: 999px;
        background: #fef3c7;
        color: #b45309;
        padding: 4px 9px;
        font-size: 11px;
        letter-spacing: .08em;
      }
      .logo {
        display: flex;
        align-items: center;
        min-height: 132px;
        padding: 12px;
        border: 1px solid #f3f4f6;
        border-radius: 6px;
        background: #ffffff;
      }
      .logo img {
        width: 100%;
        height: auto;
      }
      @media (max-width: 720px) {
        .grid { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>BuildKind logo options</h1>
      <p>Four alternate directions. These are comparison assets only; the live site logo has not been replaced.</p>
      <section class="grid">
        <article class="card">
          <div class="label"><span>Option 1</span><span class="tag">clean frame</span></div>
          <div class="logo"><img src="/assets/logo-options/buildkind-logo-option-1.svg" alt="BuildKind logo option 1" /></div>
        </article>
        <article class="card">
          <div class="label"><span>Option 2</span><span class="tag">framing studio</span></div>
          <div class="logo"><img src="/assets/logo-options/buildkind-logo-option-2.svg" alt="BuildKind logo option 2" /></div>
        </article>
        <article class="card">
          <div class="label"><span>Option 3</span><span class="tag">software flow</span></div>
          <div class="logo"><img src="/assets/logo-options/buildkind-logo-option-3.svg" alt="BuildKind logo option 3" /></div>
        </article>
        <article class="card">
          <div class="label"><span>Option 4</span><span class="tag">premium mark</span></div>
          <div class="logo"><img src="/assets/logo-options/buildkind-logo-option-4.svg" alt="BuildKind logo option 4" /></div>
        </article>
      </section>
    </main>
  </body>
</html>
